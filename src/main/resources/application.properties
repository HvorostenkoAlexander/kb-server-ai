spring.application.name=kb-server
spring.jackson.deserialization.fail_on_unknown_properties=false

logging.file.name=kb-module.log
logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr( %X{requestID}:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.pattern.file=%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] %-40.40logger{39} %X{requestID}: %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

apcs-jaeger.udp-sender.host=${JAEGER_HOST}
apcs-jaeger.udp-sender.port=${JAEGER_PORT}
apcs-jaeger.log-span.enabled=false

server.port=8089

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.web.server.request.autotime.enabled=false
management.endpoint.health.show-details=always

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

kb.oauth2.client.id=${SSO_CLIENT}
kb.oauth2.client.secret=${SSO_CLIENT_SECRET}

#keycloak.enabled=false
keycloak.authServerUrl=${SSO_URL}
keycloak.realm=${SSO_REALM}
keycloak.resource=${SSO_RESOURCE}
keycloak.bearer-only=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seeds

psm.url=${PSM_SERVER_BASEURL}
pam.url=${PAM_SERVER_BASEURL}
nsi.url.dict=${NSI_SERVER_BASEURL}

#KAFKA
kafka.ack.nack.sleep-time=3000

#kafka ssl properties
kafka.sslTruststorePassword=${KAFKA_TRUSTSTORE_PASSWORD}
kafka.sslKeystorePassword=${KAFKA_KEYSTORE_PASSWORD}
kafka.client.truststore-path=/etc/secret-volume/client.truststore.jks
kafka.client.keystore-path=/etc/secret-volume/client.keystore.jks

#ccm PGP
kafka.ccm.pgp.ssl-enabled=${KAFKA_CCM_PGP_SSL_ENABLED}
kafka.ccm.pgp.bootstrap-servers=${KAFKA_CCM_PGP_SERVER}
kafka.ccm.pgp.consumer.group-id=${KAFKA_CCM_PGP_GROUP}
kafka.ccm.pgp.topicReq=${KAFKA_CCM_PGP_TOPIC}
kafka.ccm.pgp.schema.registry.url=${KAFKA_CCM_PGP_SCHEMA}
#ccm PTS
kafka.ccm.pts.ssl-enabled=${KAFKA_CCM_PTS_SSL_ENABLED}
kafka.ccm.pts.bootstrap-servers=${KAFKA_CCM_PTS_SERVER}
kafka.ccm.pts.consumer.group-id=${KAFKA_CCM_PTS_GROUP}
kafka.ccm.pts.topicReq=${KAFKA_CCM_PTS_TOPIC}
kafka.ccm.pts.schema.registry.url=${KAFKA_CCM_PTS_SCHEMA}

#pdm
kafka.pdm.ssl-enabled=${KAFKA_PDM_SSL_ENABLED}
kafka.pdm.bootstrap-servers=${KAFKA_PDM_SERVER}
kafka.pdm.schema.registry.url=${KAFKA_PDM_SCHEMA}
kafka.pdm.consumer.group-id=${KAFKA_PDM_GROUP}
kafka.pdm.topic.microstructure=${KAFKA_PDM_TOPIC_MICRO}
kafka.pdm.topic.asap-chemical-properties=${KAFKA_PDM_TOPIC_ASAP_CHEMICAL}
kafka.pdm.topic.equivalents=${KAFKA_PDM_TOPIC_EQUVALENTS}
kafka.pdm.topic.match-tk-num=${KAFKA_PDM_TOPIC_MATCH_TK_NUM}
kafka.pdm.topic.match-rabplan-num=${KAFKA_PDM_TOPIC_MATCH_RP_NUM}
kafka.pdm.topic.pcm=${KAFKA_PDM_TOPIC_PCM}
kafka.pdm.topic.asap-tol-links=${KAFKA_PDM_TOPIC_ASAP_TOL_LINKS}
kafka.pdm.topic.kat-steel-4041=${KAFKA_PDM_TOPIC_STEEL_4041}
kafka.pdm.topic.tol-thick=${KAFKA_PDM_TOPIC_TOL_THICK}
kafka.pdm.topic.tol-width=${KAFKA_PDM_TOPIC_TOL_WIDTH}
kafka.pdm.topic.tol-length=${KAFKA_PDM_TOPIC_TOL_LENGTH}
kafka.pdm.topic.asap-mech-properties=${KAFKA_PDM_TOPIC_ASAP_MECH_PROP}
kafka.pdm.topic.tol-evenness=${KAFKA_PDM_TOPIC_TOL_EVENNESS}
kafka.pdm.topic.tk-num=${KAFKA_PDM_TOPIC_TK_NUM}
kafka.pdm.topic.ceq=${KAFKA_PDM_TOPIC_CEQ}
kafka.pdm.topic.mech-properties=${KAFKA_PDM_TOPIC_MECH_PROP}
kafka.pdm.topic.chemical-properties=${KAFKA_PDM_TOPIC_CHEMICAL_PROP}

#sadim
kafka.sadim.bootstrap-servers=${KAFKA_SADIM_SERVER}
kafka.sadim.group-id=${KAFKA_SADIM_GROUP}
kafka.sadim.topic=${KAFKA_SADIM_TOPIC}

#SAP
kafka.sap.ssl-enabled=${KAFKA_SAP_SSL_ENABLED}
kafka.sap.bootstrap-servers=${KAFKA_SAP_SERVER}
kafka.sap.group-id=${KAFKA_SAP_GROUP}
kafka.sap.topic.s3.idoczordrs=${KAFKA_SAP_TOPIC_S3_IDOCZORDRS}
kafka.sap.schema.registry.url=${KAFKA_SAP_SCHEMA}

#S3
s3.url=${S3_URL}
s3.accessKey=${S3_ACCESS_KEY}
s3.secretKey=${S3_SECRET_KEY}

#protected resource: token + authRole + pattern
#other resource - unprotected (public)
keycloak.securityConstraints[0].authRoles[0]=change-config-pdm
keycloak.securityConstraints[0].securityCollections[0].methods[0]=PUT
keycloak.securityConstraints[0].securityCollections[0].methods[1]=DELETE
keycloak.securityConstraints[0].securityCollections[0].patterns[0]=/dict/configuration/*
keycloak.securityConstraints[1].authRoles[0]=delete-pdm-message
keycloak.securityConstraints[1].securityCollections[0].methods[0]=DELETE
keycloak.securityConstraints[1].securityCollections[0].patterns[0]=/pdm_message/*
keycloak.securityConstraints[2].authRoles[0]=process-pdm-message
keycloak.securityConstraints[2].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[2].securityCollections[0].patterns[0]=/pdm_message/*
keycloak.securityConstraints[3].authRoles[0]=create-attestation-request
keycloak.securityConstraints[3].securityCollections[0].methods[0]=GET
keycloak.securityConstraints[3].securityCollections[0].patterns[0]=/launch_attestation/*
keycloak.securityConstraints[4].authRoles[0]=process-sap-message
keycloak.securityConstraints[4].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[4].securityCollections[0].patterns[0]=/sap_message/*
keycloak.securityConstraints[5].authRoles[0]=create-attestation-request
keycloak.securityConstraints[5].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[5].securityCollections[0].patterns[0] = /attestation/*

kafka.httpProxy.address=${KAFKA_REST_ADDRESS}
kafka.httpProxy.login=${KAFKA_REST_LOGIN}
kafka.httpProxy.password=${KAFKA_REST_PASSWORD}
