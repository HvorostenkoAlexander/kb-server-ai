spring.application.name=kb-module
spring.jackson.deserialization.fail_on_unknown_properties=false

logging.file.name=kb-module.log
logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr( %X{requestID}:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.pattern.file=%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] %-40.40logger{39} %X{requestID}: %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

#show transactions trace
#logging.level.org.springframework.transaction=TRACE

server.port=8089

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.web.server.request.autotime.enabled=false

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/kbs
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=kbs
spring.datasource.password=kbs
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

kb.oauth2.client.id=apcs-service
kb.oauth2.client.secret=9f482fb5-9a7b-4712-92e9-11c491730a36

#keycloak.enabled=false
keycloak.auth-server-url=https://sso-test.dp.nlmk.com/auth
keycloak.realm=apcs-test
keycloak.resource=apcs-public
keycloak.bearer-only=true

#protected resource: token + authRole + pattern
#other resource - unprotected (public)
keycloak.securityConstraints[0].authRoles[0]=sadim-reader
keycloak.securityConstraints[0].securityCollections[0].methods[0]=GET
keycloak.securityConstraints[0].securityCollections[0].patterns[0] =/sadim
keycloak.securityConstraints[0].securityCollections[0].patterns[1] =/attestation_request/*

keycloak.securityConstraints[1].authRoles[0]=change-config-pdm
keycloak.securityConstraints[1].securityCollections[0].methods[0]=PUT
keycloak.securityConstraints[1].securityCollections[0].methods[1]=DELETE
keycloak.securityConstraints[1].securityCollections[0].patterns[0] =/dict/configuration/*

keycloak.securityConstraints[2].authRoles[0]=process-pdm-message
keycloak.securityConstraints[2].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[2].securityCollections[0].patterns[0] =/pdm_message/*

keycloak.securityConstraints[3].authRoles[0]=delete-pdm-message
keycloak.securityConstraints[3].securityCollections[0].methods[0]=DELETE
keycloak.securityConstraints[3].securityCollections[0].patterns[0] =/pdm_message/*

keycloak.securityConstraints[4].authRoles[0]=create-attestation-request
keycloak.securityConstraints[4].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[4].securityCollections[0].patterns[0] =/launch_attestation/*

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seeds

pam.url = http://localhost:8083/attestation
nsi.url.dict =http://localhost:8082

spring.profiles.active=dev

#KAFKA
kafka.ack.nack.sleep-time = 3000

