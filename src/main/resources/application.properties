spring.application.name=kb-server
server.port=8089

spring.jackson.deserialization.fail_on_unknown_properties=false

logging.file.name=kb-module.log
logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr( %X{requestID}:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.pattern.file=%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] %-40.40logger{39} %X{requestID}: %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

opentracing.jaeger.log-spans=false
opentracing.jaeger.udp-sender.host=${JAEGER_HOST}
opentracing.jaeger.udp-sender.port=${JAEGER_PORT}

springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.client-id=${SSO_RESOURCE}
springdoc.use-fqn=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus,shutdown
management.metrics.web.server.request.autotime.enabled=false
management.endpoint.health.show-details=always
#ALLOW shutdown application (need ADD and ALLOW!)
management.endpoint.shutdown.enabled=true
#k8s probes
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
#less then k8s terminationGracePeriodSeconds (30sec)
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
#need user profile dev or prod for FULL filling database!
spring.flyway.locations=classpath:db/migration

service-web-client.timeout=20000
service-web-client.nsi-server.url=${NSI_SERVER_BASEURL}
service-web-client.pam-server.url=${PAM_SERVER_BASEURL}
service-web-client.psm-server.url=${PSM_SERVER_BASEURL}
service-web-client.kafka-rest.address=${KAFKA_REST_ADDRESS}
service-web-client.kafka-rest.login=${KAFKA_REST_LOGIN}
service-web-client.kafka-rest.password=${KAFKA_REST_PASSWORD}

#value 'keycloak' set in WebClientConfig.CLIENT_REGISTRATION_ID
spring.security.oauth2.client.provider.keycloak.token-uri=${SSO_URL}/realms/${SSO_REALM}/protocol/openid-connect/token
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.clientId=${SSO_CLIENT}
spring.security.oauth2.client.registration.keycloak.clientSecret=${SSO_CLIENT_SECRET}

keycloak.authServerUrl=${SSO_URL}
keycloak.realm=${SSO_REALM}
keycloak.resource=${SSO_RESOURCE}
keycloak.bearer-only=true

#KAFKA
kafka.ack.nack.sleep-time=5000
kafka.sslTruststorePassword=${KAFKA_TRUSTSTORE_PASSWORD}
kafka.sslKeystorePassword=${KAFKA_KEYSTORE_PASSWORD}
kafka.client.truststore-path=/etc/secret-volume/client.truststore.jks
kafka.client.keystore-path=/etc/secret-volume/client.keystore.jks

#ccm PGP
kafka.ccm.pgp.ssl-enabled=${KAFKA_CCM_PGP_SSL_ENABLED}
kafka.ccm.pgp.bootstrap-servers=${KAFKA_CCM_PGP_SERVER}
kafka.ccm.pgp.consumer.group-id=${KAFKA_CCM_PGP_GROUP}
kafka.ccm.pgp.topicReq=${KAFKA_CCM_PGP_TOPIC}
kafka.ccm.pgp.schema.registry.url=${KAFKA_CCM_PGP_SCHEMA}
#ccm PTS
kafka.ccm.pts.enable=false
kafka.ccm.pts.ssl-enabled=${KAFKA_CCM_PTS_SSL_ENABLED}
kafka.ccm.pts.bootstrap-servers=${KAFKA_CCM_PTS_SERVER}
kafka.ccm.pts.consumer.group-id=${KAFKA_CCM_PTS_GROUP}
kafka.ccm.pts.topicReq=${KAFKA_CCM_PTS_TOPIC}
kafka.ccm.pts.schema.registry.url=${KAFKA_CCM_PTS_SCHEMA}
