#protected resource: token + authRole + pattern
#other resource - unprotected (public)
keycloak.securityConstraints[0].authRoles[0]=change-config-pdm
keycloak.securityConstraints[0].securityCollections[0].methods[0]=PUT
keycloak.securityConstraints[0].securityCollections[0].methods[1]=DELETE
keycloak.securityConstraints[0].securityCollections[0].patterns[0]=/dict/configuration/*
keycloak.securityConstraints[1].authRoles[0]=delete-pdm-message
keycloak.securityConstraints[1].securityCollections[0].methods[0]=DELETE
keycloak.securityConstraints[1].securityCollections[0].patterns[0]=/pdm_message/*
keycloak.securityConstraints[2].authRoles[0]=process-pdm-message
keycloak.securityConstraints[2].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[2].securityCollections[0].patterns[0]=/pdm_message/*
keycloak.securityConstraints[3].authRoles[0]=create-attestation-request
keycloak.securityConstraints[3].securityCollections[0].methods[0]=GET
keycloak.securityConstraints[3].securityCollections[0].patterns[0]=/launch_attestation/*
keycloak.securityConstraints[4].authRoles[0]=process-sap-message
keycloak.securityConstraints[4].securityCollections[0].methods[0]=GET
keycloak.securityConstraints[4].securityCollections[0].methods[1]=POST
keycloak.securityConstraints[4].securityCollections[0].patterns[0]=/sap_message/*
keycloak.securityConstraints[5].authRoles[0]=cdc-processing
keycloak.securityConstraints[5].securityCollections[0].methods[0]=POST
keycloak.securityConstraints[5].securityCollections[0].patterns[0]=/cdc/*


