spring.application.name=kb-module
spring.jackson.deserialization.fail_on_unknown_properties=false

logging.file.name=kb-module.log
server.port=8089

keycloak.auth-server-url=http://127.0.0.1:7080/auth
keycloak.realm=BackEndApp
keycloak.resource=app-server
keycloak.bearer-only=true

#protected resource: token + authRole + pattern
#other resource - unprotected (public)
#TEMP#keycloak.securityConstraints[0].authRoles[0] = app-users
#TEMP#keycloak.securityConstraints[0].securityCollections[0].patterns[0] = /nsi/*

#spring.profiles.active=dev

spring.kafka.bootstrap-servers = nl-sq-dpltkfk01.ao.nlmk:9093
spring.kafka.template.default-topic = 000-0.l3-sup.db.nlmk.integral-parameters.0
spring.kafka.consumer.group-id=apcs

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.endpoint.identification.algorithm =

spring.kafka.ssl.trust-store-location=file:kafkaSsl/client.truststore.jks
spring.kafka.ssl.trust-store-password=assagai

spring.kafka.ssl.key-store-location=file:kafkaSsl/client.keystore.jks
spring.kafka.ssl.key-store-password=assagai