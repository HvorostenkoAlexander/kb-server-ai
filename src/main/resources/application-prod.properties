spring.application.name=kb-module
spring.jackson.deserialization.fail_on_unknown_properties=false

logging.file.name=kb-module.log
logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr( %X{requestID}:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.pattern.file=%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] %-40.40logger{39} %X{requestID}: %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

server.port=8089
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.web.server.request.autotime.enabled=false
management.endpoint.health.show-details=always

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

kb.oauth2.client.id=${SSO_CLIENT}
kb.oauth2.client.secret=${SSO_CLIENT_SECRET}

#keycloak.enabled=false
keycloak.authServerUrl=${SSO_URL}
keycloak.realm=${SSO_REALM}
keycloak.resource=${SSO_RESOURCE}
keycloak.bearer-only=true

#protected resource: token + authRole + pattern
#other resource - unprotected (public)
keycloak.securityConstraints[0].authRoles[0]=sadim-reader
keycloak.securityConstraints[0].securityCollections[0].methods[0]=GET
keycloak.securityConstraints[0].securityCollections[0].patterns[0] = /sadim

spring.profiles.active=prod
pam.url=${PAM_SERVER_BASEURL}/attestation
nsi.url.dict =${NSI_SERVER_BASEURL}/nsi
nsi.url.microstructure=/dict/nsd_microstructure
nsi.url.asap-chemical-properties = /dict/nsd_asap_chemical_propertiese
nsi.url.equivalents=/dict/nsd_equivalents
nsi.url.match-tk-num=/dict/nsd_match_tk_num
nsi.url.match-rabplan-num=/dict/nsd_match_rabplan_num
nsi.url.pcm=/dict/nsd_pcm
nsi.url.tolerance=/dict/nsd_asap_tol_links
nsi.url.kat-steel-4041=/dict/nsd_kat_steel_mark_gost4041
nsi.url.tol-thick=/dict/nsd_tol_thick
