kafka.pdm.topic.chemical-properties=000-0.l3-pdm.cdc.sp-chemical-properties.0

#sadim
kafka.sadim.bootstrap-servers=localhost:9092
kafka.sadim.group-id = service-prod.app-apcs.sadim
kafka.sadim.topic = PA-MU.NLMK.P3.HSM

#SAP
kafka.sap.bootstrap-servers=localhost:9092
kafka.sap.group-id =service-prod.app-apcs.sap
kafka.sap.topic.s3.idoczordrs = 000-1.s3-proxy.db.notify.int-sap-idoczordrsp.0
kafka.sap.schema.registry.url=http://xxx
kafka.sap.ssl-enabled=false

#S3
s3.url=http://xxx
