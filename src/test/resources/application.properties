#set level for logback-spring.xml
logging.level.root=INFO

spring.application.name=kb-server

#auto configure H2 database
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.hibernate.ddl-auto=validate

##show sql statement
#logging.level.org.hibernate.SQL=TRACE
##show sql values
#logging.level.org.hibernate.type.descriptor.sql=TRACE
##show transactions trace
#logging.level.org.springframework.transaction=TRACE

opentracing.jaeger.log-spans=false
opentracing.jaeger.udp-sender.host=localhost
opentracing.jaeger.udp-sender.port=6831

kb.oauth2.client.id=
kb.oauth2.client.secret=
keycloak.auth-server-url=
keycloak.realm=

#without seeds-psql because H2
spring.flyway.locations=classpath:db/migration,classpath:db/seeds-dev

service-web-client.timeout=2500
service-web-client.nsi-server.url=http://localhost:8082
service-web-client.pam-server.url=http://localhost:8083
service-web-client.psm-server.url=http://localhost:8080
service-web-client.kafka-rest.address=
service-web-client.kafka-rest.login=kb-user
service-web-client.kafka-rest.password=qwe123

