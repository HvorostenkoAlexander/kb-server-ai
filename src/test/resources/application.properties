#set level for logback-spring.xml
logging.level.root=INFO

spring.application.name=kb-server
apcs-jaeger.udp-sender.host=localhost
apcs-jaeger.udp-sender.port=6831
apcs-jaeger.log-span.enabled=false
#auto configure H2 database

spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true

##show sql statement
#logging.level.org.hibernate.SQL=TRACE
##show sql values
#logging.level.org.hibernate.type.descriptor.sql=TRACE
##show transactions trace
#logging.level.org.springframework.transaction=TRACE

kb.oauth2.client.id=
kb.oauth2.client.secret=
keycloak.auth-server-url=
keycloak.realm=

psm.url = http://localhost:8080
pam.url = http://localhost:8083/attestation
nsi.url.dict =http://localhost:8082

spring.profiles.active=dev

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#KAFKA
kafka.ack.nack.sleep-time = 3000

#kafka ssl properties
kafka.sslTruststorePassword=
kafka.sslKeystorePassword=
kafka.client.truststore-path=
kafka.client.keystore-path=

#ccm PGP
kafka.ccm.pgp.ssl-enabled=false
kafka.ccm.pgp.bootstrap-servers = localhost:9092
kafka.ccm.pgp.consumer.group-id = service-prod.app-apcs.kb.attest-request
kafka.ccm.pgp.topicReq = 000-1.l3-ccm-pgp.db.Attestation-Request.0
kafka.ccm.pgp.schema.registry.url=http://localhost:8881

#pdm
kafka.pdm.schema.registry.url=
kafka.pdm.bootstrap-servers = localhost:9092
kafka.pdm.consumer.group-id = service-prod.app-apcs.pdm
kafka.pdm.topic.microstructure = 000-0.l3-pdm.cdc.sp-microstructure.0
kafka.pdm.topic.asap-chemical-properties = 000-0.l3-pdm.cdc.sp-asap-chemical-properties.0
kafka.pdm.topic.equivalents=000-0.l3-pdm.cdc.sp-equivalents.0
kafka.pdm.topic.match-tk-num=000-0.l3-pdm.cdc.sp-match-tk-num.0
kafka.pdm.topic.match-rabplan-num=000-0.l3-pdm.cdc.sp-match-rabplan-num.0
kafka.pdm.topic.pcm=000-0.l3-pdm.cdc.sp-pcm.0
kafka.pdm.topic.asap-tol-links=000-0.l3-pdm.cdc.sp-asap-tol-links.0
kafka.pdm.topic.kat-steel-4041=000-0.l3-pdm.cdc.sp-kat-steel-mark-gost4041.0
kafka.pdm.topic.tol-thick=000-0.l3-pdm.cdc.sp-tol-thick.0
kafka.pdm.topic.tol-width=000-0.l3-pdm.cdc.sp-tol-width.0
kafka.pdm.topic.tol-length=000-0.l3-pdm.cdc.sp-tol-length.0
kafka.pdm.topic.asap-mech-properties=000-0.l3-pdm.cdc.asap-mech-properties.0
kafka.pdm.topic.tol-evenness=000-0.l3-pdm.cdc.sp-tol-evenness.0
kafka.pdm.topic.tk-num=000-0.l3-pdm.cdc.sp-tk-num.0
