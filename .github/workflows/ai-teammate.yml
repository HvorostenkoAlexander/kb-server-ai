name: AI Teammate Runner

on:
  issues:
    types: [labeled, assigned]

jobs:
  run-ai-agent:
    if: contains(github.event.issue.labels.*.name, 'ai-task')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Bot Access Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai PyGithub

      - name: Execute AI Agent Orchestrator
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python .github/scripts/ai_agent_orchestrator.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "fix(ai): automated patch for Issue #${{ github.event.issue.number }}"
          title: "[AI] Resolves Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            ## 🤖 Automated PR by gear-bot-dev
            Resolves Issue #${{ github.event.issue.number }}.
            
            *Код сгенерирован автоматически с помощью Gemini 2.0 Flash.*
          branch: "ai-fix/issue-${{ github.event.issue.number }}"
          delete-branch: true